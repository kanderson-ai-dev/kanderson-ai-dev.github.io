<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../stage.css"></head>
<body><script src="tpl.js"></script><script>
/* contain — full capture fitted inside the frame, NEVER cropped.
   params: image, imgSize [w,h], pad?, chrome? (bool: wrap in film chrome),
           tag?, url?, kicker?, chips? */
window.render = (p) => {
  const st = stage({ brackets: !!p.brackets });
  const W = innerWidth, H = innerHeight, pad = p.pad ?? 80;
  const [iw, ih] = p.imgSize;
  const availW = W - pad * 2, availH = H - pad * 2;
  const s = Math.min(availW / iw, availH / ih);
  const dw = Math.round(iw * s), dh = Math.round(ih * s);
  const holder = document.createElement('div');
  holder.style.cssText = `position:absolute;left:${(W - dw) / 2}px;top:${(H - dh) / 2}px;width:${dw}px;height:${dh}px`;
  if (p.chrome) {
    const { root, view } = chrome({ width: dw, imgSrc: p.image, imgNatural: [iw, ih], tag: p.tag, url: p.url });
    holder.style.top = ((H - dh - 46) / 2) + 'px';
    holder.appendChild(root);
  } else {
    const img = document.createElement('img');
    img.src = p.image;
    img.style.cssText = `width:${dw}px;height:${dh}px;display:block;border-radius:8px;box-shadow:0 30px 80px #000000d9,0 0 0 1px #00F5D422`;
    holder.appendChild(img);
  }
  st.appendChild(holder);
  if (p.kicker) {
    const k = kicker(p.kicker, p.kickerSize || 26);
    k.style.cssText = `position:absolute;left:${(W - dw) / 2}px;top:${(H - dh) / 2 - 60}px`;
    st.appendChild(k);
  }
  for (const c of p.chips || []) {
    const e = chip(c.text, c.cls || '');
    e.style.cssText = `position:absolute;left:${c.x}px;top:${c.y}px;font-size:${c.size || 24}px;z-index:3`;
    st.appendChild(e);
  }
};
</script></body></html>
