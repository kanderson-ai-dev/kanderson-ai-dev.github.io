<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../stage.css"></head>
<body><script src="tpl.js"></script><script>
/* phone-duo — two bezelled phone screens side by side on the stage.
   params: phones [{image,imgSize,crop?}], phoneHeight?, gap?, tag?, kicker? */
window.render = (p) => {
  const st = stage({ brackets: !!p.brackets });
  const W = innerWidth, H = innerHeight;
  const ph = p.phoneHeight || 620, gap = p.gap || 70, bezel = 10;
  const shots = p.phones.map((ph0) => {
    const [iw, ih] = ph0.imgSize;
    const crop = ph0.crop || [0, 0, iw, ih];
    const s = ph / crop[3];
    return { ph0, iw, ih, crop, s, pw: Math.round(crop[2] * s) };
  });
  const total = shots.reduce((a, x) => a + x.pw + bezel * 2 + 5, 0) + gap * (shots.length - 1);
  let x = (W - total) / 2;
  const top = (H - ph - bezel * 2 - 5) / 2 + 10;
  for (const sh of shots) {
    const frame = document.createElement('div');
    frame.style.cssText = `position:absolute;left:${x}px;top:${top}px;width:${sh.pw}px;padding:${bezel}px;border-radius:34px;background:#0b0f12;border:2.5px solid #2a3f3a;
      box-shadow:0 34px 90px #000000e0,0 0 0 1px #00F5D42e,0 0 60px #00F5D422;z-index:4`;
    const scr = document.createElement('div');
    scr.style.cssText = `position:relative;width:${sh.pw}px;height:${ph}px;border-radius:24px;overflow:hidden;background:#fff`;
    const img = document.createElement('img');
    img.src = sh.ph0.image;
    img.style.cssText = `position:absolute;left:${-sh.crop[0] * sh.s}px;top:${-sh.crop[1] * sh.s}px;width:${sh.iw * sh.s}px;height:${sh.ih * sh.s}px;display:block`;
    scr.appendChild(img);
    frame.appendChild(scr);
    st.appendChild(frame);
    x += sh.pw + bezel * 2 + 5 + gap;
  }
  if (p.kicker) {
    const k = kicker(p.kicker, 22);
    k.style.cssText = `position:absolute;left:${p.kickerX ?? 56}px;top:${p.kickerY ?? 36}px;z-index:4`;
    st.appendChild(k);
  }
};
</script></body></html>
